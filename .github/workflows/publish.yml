name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure npm auth
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Verify npm login
        run: npm whoami

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish packages
        run: pnpm exec lerna publish from-package --yes --no-verify-access
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Send release notification via Resend
        if: success() && env.RESEND_API_KEY != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          EMAIL_TO="${EMAIL_TO:-chenzehuahua@163.com}"
          RESEND_FROM="${RESEND_FROM:-onboarding@resend.dev}"
          PREV_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."($3-1)}')
          
          CHANGELOG_CONTENT=$(awk '/^## \[/{if(flag)exit; flag=1; next} flag' CHANGELOG.md | sed 's/"/\\"/g' | tr '\n' ' ')
          
          EMAIL_HTML=$(cat <<EOF
          <html>
            <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
              <h2 style="color: #2c3e50;">📦 @buildloop ${VERSION} 版本发布</h2>
              <p>大家好，@buildloop 系列包已发布 <strong>${VERSION}</strong>：</p>
              <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word;">${CHANGELOG_CONTENT}</pre>
              <p style="line-height: 1.8;">
                📦 npm: <a href="https://www.npmjs.com/package/@buildloop/lint">@buildloop/lint</a><br>
                📝 CHANGELOG: <a href="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md">查看完整 CHANGELOG</a><br>
                🔗 Compare: <a href="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_VERSION}...${VERSION}">${VERSION} 变更详情</a>
              </p>
            </body>
          </html>
          EOF
          )
          
          curl -s -X POST 'https://api.resend.com/emails' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -d "$(jq -n \
              --arg to "$EMAIL_TO" \
              --arg from "$RESEND_FROM" \
              --arg subject "📦 @buildloop ${VERSION} 版本发布" \
              --arg html "$EMAIL_HTML" \
              '{to: [$to], from: $from, subject: $subject, html: $html}')"

      - name: Send release notification via SMTP (fallback)
        if: success() && env.RESEND_API_KEY == '' && env.SMTP_PASSWORD != ''
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          EMAIL_TO="${EMAIL_TO:-chenzehuahua@163.com}"
          SMTP_FROM="${SMTP_FROM:-$SMTP_USER}"
          PREV_VERSION=$(echo "$VERSION" | awk -F. '{print $1"."$2"."($3-1)}')
          CHANGELOG_CONTENT=$(awk '/^## \[/{if(flag)exit; flag=1; next} flag' CHANGELOG.md)
          
          export VERSION EMAIL_TO SMTP_FROM PREV_VERSION CHANGELOG_CONTENT
          export GITHUB_REPOSITORY="${GITHUB_REPOSITORY}"
          
          python3 <<'PYEOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os
          
          version = os.environ['VERSION']
          changelog = os.environ['CHANGELOG_CONTENT']
          repo = os.environ['GITHUB_REPOSITORY']
          prev_version = os.environ['PREV_VERSION']
          email_to = os.environ['EMAIL_TO']
          
          msg = MIMEMultipart('alternative')
          msg['Subject'] = f'📦 @buildloop {version} 版本发布'
          msg['From'] = os.environ['SMTP_FROM']
          msg['To'] = email_to
          
          html = f"""
          <html><body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
            <h2 style="color: #2c3e50;">📦 @buildloop {version} 版本发布</h2>
            <p>大家好，@buildloop 系列包已发布 <strong>{version}</strong>：</p>
            <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap;">{changelog}</pre>
            <p style="line-height: 1.8;">
              📦 npm: <a href="https://www.npmjs.com/package/@buildloop/lint">@buildloop/lint</a><br>
              📝 CHANGELOG: <a href="https://github.com/{repo}/blob/main/CHANGELOG.md">查看完整 CHANGELOG</a><br>
              🔗 Compare: <a href="https://github.com/{repo}/compare/{prev_version}...{version}">{version} 变更详情</a>
            </p>
          </body></html>
          """
          
          msg.attach(MIMEText(html, 'html'))
          
          port = int(os.environ.get('SMTP_PORT', '465'))
          with smtplib.SMTP_SSL(os.environ['SMTP_HOST'], port) if port == 465 else smtplib.SMTP(os.environ['SMTP_HOST'], port) as server:
              if port != 465:
                  server.starttls()
              server.login(os.environ['SMTP_USER'], os.environ['SMTP_PASSWORD'])
              server.send_message(msg)
          PYEOF
